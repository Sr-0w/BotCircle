name: Android release

# Builds the native Android app (apps/android) and publishes the APK as a GitHub pre-release.
# Runs when apps/android/RELEASE changes (it holds the tag to publish, e.g. android-v0.1.0-alpha.1),
# when such a tag is pushed, or manually with a tag name.
on:
  push:
    tags: ['android-v*']
    branches: ['**']
    paths: ['apps/android/RELEASE']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. android-v0.1.0-alpha.1)'
        required: false
      validation_only:
        description: 'Compile and test without creating a tag or publishing a release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag
        if: inputs.validation_only != true
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then tag="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"
          else tag="$(tr -d '[:space:]' < apps/android/RELEASE)"; fi
          case "$tag" in android-v[0-9]*) ;; *) echo "Bad tag: $tag"; exit 1;; esac
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/botcircle-release.jks"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/botcircle-release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | grep -i 'SHA-256'
      - name: Compile release and run unit and Compose tests
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:compileReleaseKotlin :app:testDebugUnitTest --stacktrace
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            mkdir -p apps/android/app/build/emulator
            # One line: the emulator runner executes each script line in its own shell.
            if [ -f apps/android/app/build/outputs/apk/release/app-release.apk ]; then adb install -r apps/android/app/build/outputs/apk/release/app-release.apk; else adb install -r apps/android/app/build/outputs/apk/debug/app-debug.apk; fi
            adb logcat -c
            adb shell am start -W -n app.dot.opendots/.MainActivity > apps/android/app/build/emulator/launch.txt
            adb shell uiautomator dump /sdcard/botcircle-startup.xml
            adb pull /sdcard/botcircle-startup.xml apps/android/app/build/emulator/startup.xml
            adb exec-out screencap -p > apps/android/app/build/emulator/startup.png
            adb logcat -d -s AndroidRuntime:E > apps/android/app/build/emulator/crash.log
            adb shell pidof app.dot.opendots > apps/android/app/build/emulator/pid.txt
            grep -q 'Server address' apps/android/app/build/emulator/startup.xml
            if grep -q 'FATAL EXCEPTION' apps/android/app/build/emulator/crash.log; then exit 1; fi
      - name: Upload validation APK and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-validation
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/reports/tests/
            apps/android/app/build/test-results/
            apps/android/app/build/shots/
            apps/android/app/build/emulator/
          retention-days: 7
      - name: Publish pre-release
        if: inputs.validation_only != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="BotCircle-${TAG#android-v}.apk"
          cp apps/android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$TAG" "$apk" --prerelease --target "$GITHUB_SHA" \
            --title "BotCircle Android ${TAG#android-v}" \
            --notes "Alpha build of the native Android app (Kotlin, Jetpack Compose, Quiet UI). Release build signed with the fixed BotCircle key: it updates the previous signed build in place (builds up to 0.1.0-alpha.36 were debug-signed: uninstall those once). Requires Android 8.0+; backdrop blur needs Android 12+. Connect it to your own BotCircle server (HTTPS)."
